name: CI/CD

on:
  push:
    branches: 
      - development
      - production

jobs:

  # development

  build-development:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

  push-development: 
    if: github.ref == 'refs/heads/development'
    needs: build-development
    runs-on: ubuntu-latest
    steps:
      - name: Connect to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          push: true
          tags: ${{vars.DOCKER_IMAGE}}

  deploy-development:
    if: github.ref == 'refs/heads/development'
    needs: push-development
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USERNAME}}
          password: ${{secrets.SERVER_PASSWORD}}
          port: ${{secrets.SERVER_PORT}}
          script: |
            docker stop ${{vars.DOCKER_CONTAINER}}
            docker rm ${{vars.DOCKER_CONTAINER}}
            docker rmi ${{vars.DOCKER_IMAGE}}
            docker run --name ${{vars.DOCKER_CONTAINER}} -d -p ${{vars.DOCKER_PORT}}:${{vars.DOCKER_PORT}} --env-file /var/www/html/selarashomeid/development.env ${{vars.DOCKER_IMAGE}}

  # production

  build-production:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

  push-production: 
    if: github.ref == 'refs/heads/production'
    needs: build-production
    runs-on: ubuntu-latest
    steps:
      - name: Connect to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          push: true
          tags: ${{vars.DOCKER_IMAGE}}

  deploy-production:
    if: github.ref == 'refs/heads/production'
    needs: push-production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USERNAME}}
          password: ${{secrets.SERVER_PASSWORD}}
          port: ${{secrets.SERVER_PORT}}
          script: |
            docker stop ${{vars.DOCKER_CONTAINER}}
            docker rm ${{vars.DOCKER_CONTAINER}}
            docker rmi ${{vars.DOCKER_IMAGE}}
            docker run --name ${{vars.DOCKER_CONTAINER}} -d -p ${{vars.DOCKER_PORT}}:${{vars.DOCKER_PORT}} --env-file /var/www/html/selarashomeid/production.env ${{vars.DOCKER_IMAGE}}